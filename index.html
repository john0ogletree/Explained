<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">Explained</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            color: #24292f;
            line-height: 1.7;
            background-color: #ffffff;
            display: grid;
            grid-template-columns: 20% 80%;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* 20% Sidebar */
        .sidebar {
            background: #f6f8fa;
            border-right: 1px solid #d0d7de;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 20px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #d0d7de;
            color: #111;
            cursor: pointer;
            word-break: break-word;
        }

        .nav-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        button { 
            background: #ffffff; 
            border: 1px solid rgba(27,31,36,0.15); 
            padding: 9px 14px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            border-radius: 6px; 
            font-weight: 500;
            color: #24292f;
            text-align: left;
            transition: background 0.15s ease, border-color 0.15s ease;
            width: 100%;
            word-break: break-word;
        }
        button:hover { 
            background: #f3f4f6; 
            border-color: rgba(27,31,36,0.3);
        }

        #share-btn { display: none; }

        .sidebar-nav-header {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #57606a;
            margin: 16px 0 8px 0;
        }

        ul#file-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            width: 100%;
            flex-grow: 1;
        }

        ul#file-list li { 
            margin: 6px 0; 
            width: 100%;
        }

        ul#file-list a { 
            color: #24292f; 
            text-decoration: none; 
            font-size: 0.95rem; 
            font-weight: 400; 
            display: block;
            padding: 7px 10px;
            border-radius: 6px;
            word-break: break-word;
            overflow-wrap: break-word;
            transition: background 0.12s ease;
            width: 100%;
        }

        ul#file-list a:hover { 
            background: #eaeef2;
            color: #0969da;
        }

        ul#file-list a.active {
            background: #ddf4ff;
            color: #0969da;
            font-weight: 600;
        }

        /* Support Footer inside Sidebar */
        .sidebar-footer {
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid #d0d7de;
            font-size: 0.8rem;
            color: #57606a;
        }

        .sidebar-footer .support-note {
            margin: 0 0 10px 0;
            line-height: 1.4;
            color: #57606a;
            font-size: 0.78rem;
        }

        .support-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .support-links a {
            color: #0969da;
            background: #ffffff;
            border: 1px solid #d0d7de;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .support-links a:hover {
            background: #f3f4f6;
            text-decoration: underline;
        }

        /* 80% Main Content Area */
        .main-content {
            padding: 48px 64px;
            overflow-x: hidden;
            width: 100%;
            max-width: 1100px;
        }

        #page-title {
            margin-top: 0;
            font-size: 2.4rem;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 16px;
            color: #111;
            word-break: break-word;
        }

        #content {
            margin-top: 32px;
            word-break: break-word;
            font-size: 1.05rem;
        }

        #content p {
            margin: 16px 0;
        }

        h1, h2, h3 { 
            color: #111; 
            border-bottom: 1px solid #eaeaea; 
            padding-bottom: 8px; 
            margin-top: 1.8em;
            word-break: break-word;
        }
        h2 { font-size: 1.6rem; }
        h3 { font-size: 1.3rem; }

        /* Table Styling with Horizontal Scroll Support */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 24px 0;
            font-size: 0.95rem;
            background-color: #ffffff;
            display: block;
            overflow-x: auto;
            white-space: nowrap;
        }

        th, td {
            border: 1px solid #d0d7de;
            padding: 12px 18px;
            text-align: left;
        }

        th {
            background-color: #f6f8fa;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        pre { 
            background: #f6f8fa; 
            padding: 18px; 
            border-radius: 8px; 
            overflow-x: auto; 
            border: 1px solid #d0d7de;
            max-width: 100%;
            margin: 20px 0;
        }
        code { 
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; 
            background: rgba(175,184,193,0.2); 
            padding: 0.2em 0.4em; 
            border-radius: 4px; 
            font-size: 85%;
        }
        pre code { background: transparent; padding: 0; font-size: 90%; white-space: pre; }
        blockquote { 
            border-left: 4px solid #0969da; 
            margin: 20px 0; 
            padding: 8px 20px; 
            color: #57606a; 
            background: #f6f8fa;
            border-radius: 0 6px 6px 0;
        }

        /* Responsive fallback for narrow screens */
        @media (max-width: 768px) {
            body { grid-template-columns: 30% 70%; }
            .main-content { padding: 28px 24px; }
        }
    </style>
</head>
<body>

    <!-- 20% Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-title" onclick="showIndex()">Explained</div>
        
        <div class="nav-controls">
            <button id="share-btn" onclick="shareArticle()">🔗 Share</button>
        </div>

        <div class="sidebar-nav-header">Articles</div>
        <ul id="file-list">
            <li style="font-size:0.85rem; color:#666;">Loading...</li>
        </ul>

        <!-- Support Footer -->
        <div class="sidebar-footer">
            <div class="support-note">If you find these write-ups helpful and would like to support my independent work, tips are always appreciated:</div>
            <div class="support-links">
                <a href="https://cash.app/$john0ogletree" target="_blank" rel="noopener">Cash App</a>
                <a href="https://chime.com/john0ogletree" target="_blank" rel="noopener">Chime</a>
                <a href="https://venmo.com/john0ogletree" target="_blank" rel="noopener">Venmo</a>
                <a href="https://paypal.me/john0ogletree" target="_blank" rel="noopener">PayPal</a>
            </div>
        </div>
    </aside>

    <!-- 80% Main Content Area -->
    <main class="main-content">
        <h1 id="page-title">Overview</h1>
        <div id="content">
            <p>Select a topic from the sidebar.</p>
        </div>
    </main>

    <script>
        const USERNAME = 'john0ogletree';
        const REPO = 'explained';
        const POSTS_DIR = '';
        const GITHUB_TOKEN = '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';

        let currentMarkdownText = '';
        let currentTitle = '';

        // Zero-dependency native Markdown parser with table support
        function parseMarkdown(text) {
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            const lines = html.split('\n');
            let inTable = false;
            let tableHtml = '';
            let processedLines = [];

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('|') && line.endsWith('|')) {
                    if (line.replace(/[\s\|:-]/g, '') === '') {
                        continue; 
                    }
                    
                    if (!inTable) {
                        inTable = true;
                        tableHtml = '<table>\n';
                    }

                    let cells = line.split('|').slice(1, -1);
                    let rowType = !tableHtml.includes('<thead>') ? 'th' : 'td';
                    
                    if (rowType === 'th') {
                        tableHtml += '  <thead>\n    <tr>\n';
                        cells.forEach(cell => { tableHtml += `      <th>${cell.trim()}</th>\n`; });
                        tableHtml += '    </tr>\n  </thead>\n  <tbody>\n';
                    } else {
                        tableHtml += '    <tr>\n';
                        cells.forEach(cell => { tableHtml += `      <td>${cell.trim()}</td>\n`; });
                        tableHtml += '    </tr>\n';
                    }
                    continue;
                } else if (inTable) {
                    tableHtml += '  </tbody>\n</table>';
                    processedLines.push(tableHtml);
                    inTable = false;
                    tableHtml = '';
                }
                processedLines.push(lines[i]);
            }
            if (inTable) {
                tableHtml += '  </tbody>\n</table>';
                processedLines.push(tableHtml);
            }

            html = processedLines.join('\n');

            return html
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/^\> (.*$)/gm, '<blockquote>$1</blockquote>')
                .split(/\n\n+/)
                .map(para => {
                    para = para.trim();
                    if (!para.startsWith('<h') && !para.startsWith('<blockquote') && !para.startsWith('<table') && para.length > 0) {
                        return `<p>${para.replace(/\n/g, '<br>')}</p>`;
                    }
                    return para;
                })
                .join('\n');
        }

        async function router() {
            const hash = window.location.hash.substring(1);
            updateActiveSidebarLink(hash);

            if (hash) {
                const filename = decodeURIComponent(hash);
                currentTitle = filename.replace(/\.md$/, '').replace(/[-_]/g, ' ');
                const formattedTitle = currentTitle.charAt(0).toUpperCase() + currentTitle.slice(1);
                const url = POSTS_DIR ? `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${POSTS_DIR}/${filename}` : `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${filename}`;
                await loadMarkdownContent(url, formattedTitle);
            } else {
                showIndexView();
            }
        }

        async function loadMarkdownFiles() {
            const listContainer = document.getElementById('file-list');
            const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${POSTS_DIR}`;

            const headers = { 'Accept': 'application/vnd.github+json' };
            if (GITHUB_TOKEN) {
                headers['Authorization'] = `Bearer ${GITHUB_TOKEN}`;
            }

            try {
                const response = await fetch(apiUrl, { headers });
                if (!response.ok) throw new Error('Network error');

                const items = await response.json();
                
                const mdFiles = items.filter(item => 
                    item.type === 'file' && 
                    item.name.endsWith('.md') && 
                    item.name.toLowerCase() !== 'readme.md'
                );

                listContainer.innerHTML = '';

                if (mdFiles.length === 0) {
                    listContainer.innerHTML = '<li style="font-size:0.85rem; color:#666;">No files.</li>';
                    return;
                }

                const currentHash = window.location.hash.substring(1);

                mdFiles.forEach(file => {
                    const title = file.name
                        .replace(/\.md$/, '')
                        .replace(/[-_]/g, ' ');

                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.textContent = title.charAt(0).toUpperCase() + title.slice(1);
                    a.href = `#${file.name}`;
                    a.setAttribute('data-file', file.name);

                    if (file.name === decodeURIComponent(currentHash)) {
                        a.classList.add('active');
                    }

                    li.appendChild(a);
                    listContainer.appendChild(li);
                });

            } catch (error) {
                listContainer.innerHTML = '<li style="font-size:0.85rem; color:#d9381e;">Error.</li>';
            }
        }

        function updateActiveSidebarLink(currentFilename) {
            const links = document.querySelectorAll('#file-list a');
            links.forEach(link => {
                if (link.getAttribute('data-file') === decodeURIComponent(currentFilename)) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        async function loadMarkdownContent(fileUrl, title) {
            const contentDiv = document.getElementById('content');
            const pageTitle = document.getElementById('page-title');
            const shareBtn = document.getElementById('share-btn');

            contentDiv.innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Fetch error');
                currentMarkdownText = await response.text();
                
                pageTitle.textContent = title;
                document.title = `${title} - Explained`;
                
                shareBtn.style.display = 'block';
                shareBtn.textContent = '🔗 Share';

                contentDiv.innerHTML = parseMarkdown(currentMarkdownText);
            } catch (error) {
                contentDiv.innerHTML = '<p>Error loading content.</p>';
            }
        }

        async function shareArticle() {
            const formattedTitle = currentTitle.charAt(0).toUpperCase() + currentTitle.slice(1);
            
            const shareData = {
                title: formattedTitle,
                text: `Explained: ${formattedTitle}`,
                url: window.location.href
            };

            const shareBtn = document.getElementById('share-btn');

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(`${shareData.text}\n\n${shareData.url}`);
                    shareBtn.textContent = '✅ Copied!';
                    setTimeout(() => {
                        shareBtn.textContent = '🔗 Share';
                    }, 2000);
                }
            } catch (err) {}
        }

        function showIndexView() {
            const contentDiv = document.getElementById('content');
            const pageTitle = document.getElementById('page-title');
            const shareBtn = document.getElementById('share-btn');

            pageTitle.textContent = 'Explained';
            document.title = 'Explained';

            shareBtn.style.display = 'none';
            contentDiv.innerHTML = '<p>Select a topic from the sidebar.</p>';
        }

        function showIndex() {
            window.location.hash = '';
        }

        loadMarkdownFiles();
        window.addEventListener('hashchange', router);
        router();
    </script>

</body>
</html>
